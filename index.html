    <!-- AUDIO SYNTHESIS & ENGINE LOGIC -->
    <script>
        /**
         * Web Audio Synthesizer for UI Effects & Ambient Soundscapes
         */
        class AudioSynthEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playWarpSound() {
                if (this.isMuted) return;
                this.init();
                
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            }

            playClickSound() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                const btn = document.getElementById('audioIcon');
                if (this.isMuted) {
                    btn.className = 'fa-solid fa-volume-xmark text-rose-400';
                } else {
                    btn.className = 'fa-solid fa-volume-high text-slate-400';
                    this.playClickSound();
                }
            }
        }

        const audioEngine = new AudioSynthEngine();

        /**
         * Interactive Multiverse Portal Tree Graph Canvas Renderer
         */
        class PortalTreeGraph {
            constructor() {
                this.nodes = [];
                this.canvas = document.getElementById('portalGraphCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.animFrame = null;
                this.setupResize();
                this.setupInteraction();
            }

            setupResize() {
                const resize = () => {
                    const rect = this.canvas.parentElement.getBoundingClientRect();
                    this.canvas.width = rect.width;
                    this.canvas.height = rect.height;
                    this.draw();
                };
                window.addEventListener('resize', resize);
                setTimeout(resize, 100);
            }

            addNode(id, title, styleKey) {
                const x = Math.random() * (this.canvas.width - 60) + 30;
                const y = Math.random() * (this.canvas.height - 60) + 30;
                const colors = {
                    'cyberpunk': '#f43f5e',
                    'luxury': '#eab308',
                    'dark-saas': '#6366f1',
                    'glassmorphism': '#06b6d4',
                    'retro90s': '#10b981',
                    'minimalist': '#94a3b8',
                    'neumorphic': '#a855f7'
                };
                
                const newNode = {
                    id: id,
                    title: title,
                    x: x,
                    y: y,
                    radius: 8,
                    color: colors[styleKey] || '#6366f1',
                    connections: this.nodes.length > 0 ? [this.nodes[this.nodes.length - 1].id] : []
                };

                this.nodes.push(newNode);
                document.getElementById('portalCount').textContent = this.nodes.length;
                this.draw();
            }

            resetNodes() {
                this.nodes = [];
                document.getElementById('portalCount').textContent = 0;
                this.draw();
            }

            setupInteraction() {
                this.canvas.addEventListener('click', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;

                    this.nodes.forEach(node => {
                        const dist = Math.hypot(node.x - clickX, node.y - clickY);
                        if (dist <= node.radius + 8) {
                            audioEngine.playClickSound();
                            engine.loadUniverseById(node.id);
                        }
                    });
                });
            }

            draw() {
                if (!this.ctx) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw connections
                this.ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
                this.ctx.lineWidth = 1.5;
                this.nodes.forEach(node => {
                    node.connections.forEach(targetId => {
                        const targetNode = this.nodes.find(n => n.id === targetId);
                        if (targetNode) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(node.x, node.y);
                            this.ctx.lineTo(targetNode.x, targetNode.y);
                            this.ctx.stroke();
                        }
                    });
                });

                // Draw nodes
                this.nodes.forEach((node) => {
                    // Outer aura glow
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius + 4, 0, Math.PI * 2);
                    this.ctx.fillStyle = node.color + '33';
                    this.ctx.fill();

                    // Core circle
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = node.color;
                    this.ctx.fill();
                    this.ctx.lineWidth = 2;

                                <p class="text-xs text-slate-400 leading-relaxed">Breathe gently. Explore ambient stillness in this procedural acoustic space.</p>
                                <button onclick="triggerZenSynth()" class="px-8 py-3 rounded-full border border-slate-700 hover:border-slate-500 text-xs uppercase tracking-widest text-slate-200 transition bg-slate-900/50">
                                    Harmonize Tone
                                </button>
                            </div>
                        </div>`;

                        js = `
                            function triggerZenSynth() {
                                try {
                                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                    const osc = ctx.createOscillator();
                                    const gain = ctx.createGain();
                                    osc.type = 'sine';
                                    osc.frequency.setValueAtTime(261.63, ctx.currentTime); // C4
                                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
                                    osc.connect(gain);
                                    gain.connect(ctx.destination);
                                    osc.start();
                                    osc.stop(ctx.currentTime + 3);
                                } catch(e) {}
                            }
                        `;
                        break;

                    default: // Default SaaS
                        html = `
                        <div class="min-h-screen bg-slate-950 text-slate-100 p-8">
                            <header class="flex justify-between items-center max-w-6xl mx-auto mb-16">
                                <div class="flex items-center space-x-2">
                                    <div class="w-8 h-8 brand-gradient theme-radius flex items-center justify-center text-white font-extrabold"><i class="fa-solid fa-layer-group"></i></div>
                                    <span class="font-bold text-lg">${topic}</span>
                                </div>
                                <button class="px-4 py-2 brand-gradient text-white text-xs font-semibold theme-radius brand-glow">Launch Platform</button>
                            </header>

                            <main class="max-w-4xl mx-auto text-center space-y-6">
                                <span class="px-3 py-1 rounded-full text-xs font-mono bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">NEXT-GEN INFRASTRUCTURE</span>
                                <h1 class="text-5xl font-extrabold tracking-tight leading-tight">Scale Your Digital Operations with ${topic}</h1>
                                <p class="text-slate-400 text-base max-w-2xl mx-auto">Automate workflows, synthesize procedural assets, and deploy real-time micro-applications directly from one unified cloud dashboard.</p>
                                
                                <div class="pt-6 flex justify-center space-x-4">
                                    <button class="px-6 py-3 brand-gradient text-white font-semibold text-sm theme-radius brand-glow">Start Free Trial</button>
                                    <button class="px-6 py-3 bg-slate-900 border border-slate-800 text-slate-300 font-semibold text-sm theme-radius">Read Documentation</button>
                                </div>

                                <div class="pt-12 grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                                    <div class="bg-slate-900 p-6 theme-radius border border-slate-800">
                                        <i class="fa-solid fa-bolt text-indigo-400 text-xl mb-3"></i>
                                        <h3 class="font-bold text-sm mb-1">Instant Synthesis</h3>
                                        <p class="text-xs text-slate-400">Generate responsive frontend modules on demand.</p>
                                    </div>
                                    <div class="bg-slate-900 p-6 theme-radius border border-slate-800">
                                        <i class="fa-solid fa-shield-halved text-indigo-400 text-xl mb-3"></i>
                                        <h3 class="font-bold text-sm mb-1">Quantum Encryption</h3>
                                        <p class="text-xs text-slate-400">End-to-end telemetry protection standard.</p>
                                    </div>
                                    <div class="bg-slate-900 p-6 theme-radius border border-slate-800">
                                        <i class="fa-solid fa-globe text-indigo-400 text-xl mb-3"></i>
                                        <h3 class="font-bold text-sm mb-1">Global Edge Network</h3>
                                        <p class="text-xs text-slate-400">Sub-millisecond node delivery across all regions.</p>
                                    </div>
                                </div>
                            </main>
                        </div>`;
                        break;
                }

                return { html, css, js };
            }
        }

        const engine = new ProceduralEngine();

        /**
         * User Interface Controller & Viewport Switcher
         */
        class UIController {
            constructor() {
                this.currentMainTab = 'preview';
                this.currentSideTab = 'generator';
            }

            switchMainTab(tab) {
                audioEngine.playClickSound();
                this.currentMainTab = tab;

                ['preview', 'html', 'css', 'js', 'config'].forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    const view = document.getElementById(`view-${t}`);
                    
                    if (t === tab) {
                        btn.className = 'px-3 py-1.5 rounded-md text-xs font-medium bg-slate-800 text-indigo-400 flex items-center space-x-1.5 border border-slate-700/60';
                        view.classList.remove('hidden');
                    } else {
                        btn.className = 'px-3 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center space-x-1.5';
                        view.classList.add('hidden');
                    }
                });
            }

            switchSideTab(tab) {
                audioEngine.playClickSound();
                this.currentSideTab = tab;

                ['generator', 'portals'].forEach(t => {
                    const btn = document.getElementById(`sideTab-${t}`);
                    const panel = document.getElementById(`panel-${t}`);

                    if (t === tab) {
                        btn.className = 'flex-1 py-3 border-b-2 border-indigo-500 text-indigo-400 font-semibold bg-slate-800/40';
                        panel.classList.remove('hidden');
                        if (t === 'portals') portalTree.draw();
                    } else {
                        btn.className = 'flex-1 py-3 border-b-2 border-transparent hover:text-slate-200';
                        panel.classList.add('hidden');
                    }
                });
            }

            setViewport(mode) {
                audioEngine.playClickSound();
                const frame = document.getElementById('viewportFrame');
                
                // Reset active styles on viewport buttons
                document.querySelectorAll('.vp-btn').forEach(btn => {
                    btn.className = 'vp-btn p-1.5 px-2.5 rounded text-xs font-medium text-slate-400 hover:text-slate-200';
                });
                
                document.getElementById(`vp-${mode}`).className = 'vp-btn p-1.5 px-2.5 rounded text-xs font-medium bg-slate-800 text-indigo-400';

                if (mode === 'desktop') {
                    frame.style.width = '100%';
                    frame.style.height = '100%';
                } else if (mode === 'tablet') {
                    frame.style.width = '768px';
                    frame.style.height = '90%';
                } else if (mode === 'mobile') {
                    frame.style.width = '375px';
                    frame.style.height = '667px';
                }
            }
        }

        const ui = new UIController();

        // Boot system on window ready
        window.onload = () => {
            engine.init();
        };
    </script>
</body>
</html>
